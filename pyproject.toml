[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yingbian-core"
version = "0.2.0"
description = "应变：W1 施工图实现（四态传播 + shift/replace/drop 修复 + W2 接口）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.scripts]
yingbian = "yingbian.cli:main"

[tool.setuptools]
packages = ["yingbian"]
